name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets > /tmp/clippy.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        run: cargo test --workspace > /tmp/test.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Rust CI — clippy: ${{ steps.clippy.outcome }} · test: ${{ steps.test.outcome }}"
            echo "### versions"
            echo '```'
            rustc --version; cargo --version
            echo '```'
            echo "### clippy (tail)"
            echo '```'
            tail -n 80 /tmp/clippy.log
            echo '```'
            echo "### test (tail)"
            echo '```'
            tail -n 80 /tmp/test.log
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce checks
        if: steps.clippy.outcome != 'success' || steps.test.outcome != 'success'
        run: exit 1

  artifacts-drift:
    name: Schema artifacts drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate schema + registry artifacts
        run: cargo run -p morphic-schema --bin export
      - name: Check drift
        run: git diff --exit-code -- schemas/
      - name: Post generated artifacts as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Generated schema artifacts"
            echo "### registry_v1.json"
            echo '```json'
            cat schemas/registry_v1.json
            echo '```'
            echo "### morphic_ui_schema_v1.json"
            echo '```json'
            cat schemas/morphic_ui_schema_v1.json
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json

  dart-quality:
    name: Dart (analyze · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/morphic_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        id: darttest
        continue-on-error: true
        run: flutter test > /tmp/darttest.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Dart CI — test: ${{ steps.darttest.outcome }}"
            echo '### versions'
            echo '```'
            flutter --version
            echo '```'
            echo '### head'
            echo '```'
            head -n 30 /tmp/darttest.log
            echo '```'
            echo '### failure details'
            echo '```'
            grep -nE "Expected|Actual|Which|EXCEPTION|was thrown|consider|failed|passed|loading|settled|pump" /tmp/darttest.log | head -n 40
            echo '```'
            echo '### tail'
            echo '```'
            tail -n 30 /tmp/darttest.log
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce checks
        if: steps.darttest.outcome != 'success'
        run: exit 1

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [rust-quality, dart-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate Flutter Android scaffolding
        run: |
          flutter create --platforms=android --org dev.morphic --project-name morphic_flutter /tmp/morphic_scaffold
          cp -rn /tmp/morphic_scaffold/android apps/morphic_flutter/
      - name: Pub get
        run: flutter pub get
        working-directory: apps/morphic_flutter
      - name: Build native libraries (3 ABIs)
        run: bash tools/build_android_native.sh
      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: apps/morphic_flutter
      - name: Verify 16 KB alignment
        run: python3 tools/check_alignment.py apps/morphic_flutter/android/app/src/main/jniLibs
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphic-debug-apk
          path: apps/morphic_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  android-runtime-smoke:
    name: Android runtime smoke (emulator)
    runs-on: ubuntu-latest
    needs: [rust-quality, dart-quality]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate Flutter Android scaffolding
        run: |
          flutter create --platforms=android --org dev.morphic --project-name morphic_flutter /tmp/morphic_scaffold
          cp -rn /tmp/morphic_scaffold/android apps/morphic_flutter/
      - name: Pub get
        run: flutter pub get
        working-directory: apps/morphic_flutter
      - name: Build native libraries (x86_64 for emulator)
        run: |
          rustup target add x86_64-linux-android
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_AR="$TC/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release -p morphic-bridge --target x86_64-linux-android
          mkdir -p apps/morphic_flutter/android/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/libmorphic_bridge.so \
             apps/morphic_flutter/android/app/src/main/jniLibs/x86_64/
      - name: Run integration test on emulator
        id: emutest
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          working-directory: apps/morphic_flutter
          script: |
            { echo "=== pwd ==="; pwd; echo "=== flutter devices ==="; flutter devices; echo "=== adb devices ==="; adb devices; } > /tmp/emu_test.log 2>&1 || true
            timeout 600 flutter test integration_test/poc_smoke_test.dart >> /tmp/emu_test.log 2>&1
      - name: Report emulator test output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Emulator smoke — ${{ steps.emutest.outcome }}"
            echo '```'
            head -60 /tmp/emu_test.log 2>/dev/null
            echo "... (tail) ..."
            tail -40 /tmp/emu_test.log 2>/dev/null
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce emulator test
        if: steps.emutest.outcome != 'success'
        run: exit 1
