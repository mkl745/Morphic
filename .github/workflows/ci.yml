name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (check)
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check > /tmp/fmt.log 2>&1
      - name: Clippy (deny warnings)
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
      # Golden snapshots must be committed to be a real gate. On the very first run after
      # goldens are introduced they do not exist yet, so generate them once and let the
      # auto-commit step below push them for review. Every later run takes the `exit 0`
      # branch and the committed snapshots gate normally (INSTA_UPDATE is never set).
      - name: Golden snapshots present?
        id: goldens
        continue-on-error: true
        run: |
          DIR=engine/crates/morphic-compiler/tests/snapshots
          # An explicit, reviewable regeneration. This repo has no local Rust toolchain, so a
          # legitimate behaviour change cannot be re-snapshotted on a laptop; without this the
          # only options are hand-editing snapshots or weakening the gate. The commit message
          # must ask for it, and the bot's pushed diff is the review artifact.
          if git log -1 --pretty=%B | grep -q '\[regenerate-goldens\]'; then
            echo "golden regeneration requested by the commit message"
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            INSTA_UPDATE=always cargo test -p morphic-compiler --test goldens > /tmp/goldens.log 2>&1
            exit 0
          fi
          if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "goldens committed; snapshot gate is LIVE"
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "goldens missing; generating once for first-commit bootstrap"
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          INSTA_UPDATE=always cargo test -p morphic-compiler --test goldens > /tmp/goldens.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        # --no-fail-fast: one failing target must not hide the others. Without it a golden
        # failure stopped the run before morphic-core's AT-02 scorer could write its scorecard.
        run: cargo test --workspace --no-fail-fast > /tmp/test.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Rust CI — fmt: ${{ steps.fmt.outcome }} · clippy: ${{ steps.clippy.outcome }} · test: ${{ steps.test.outcome }}"
            echo "### versions"
            echo '```'
            rustc --version; cargo --version
            echo '```'
            echo "### fmt (check)"
            echo '```'
            head -n 60 /tmp/fmt.log
            echo '```'
            echo "### clippy (tail)"
            echo '```'
            tail -n 80 /tmp/clippy.log
            echo '```'
            echo "### test (tail)"
            echo '```'
            tail -n 80 /tmp/test.log
            echo '```'
            echo "### test failures (extracted)"
            echo '```'
            grep -E "^test .* FAILED" /tmp/test.log | head -n 40 || true
            grep -A 6 "panicked at" /tmp/test.log | head -n 120 || true
            echo '```'
            echo "### Parser fuzz smoke"
            echo '```'
            cat target/fuzz-smoke.md 2>/dev/null || echo "fuzz report not produced"
            echo '```'
            echo "### M1.3 query perf (CI runner, not a phone)"
            echo '```'
            cat target/query-perf.md 2>/dev/null || echo "query perf report not produced"
            echo '```'
            echo "### AT-02 schema accuracy"
            echo '```'
            cat target/schema-accuracy.md 2>/dev/null || echo "scorecard not produced"
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Auto-format / commit bootstrapped goldens and push back
        if: steps.fmt.outcome != 'success' || steps.goldens.outputs.bootstrapped == 'true'
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: rustfmt + bootstrap compiler goldens [skip ci]"
          # Both this job and the Dart golden gate can push generated artifacts from the same
          # run. Without a rebase the second push is a non-fast-forward and turns a successful
          # regeneration into a red job. The paths are disjoint, so the rebase is clean.
          BRANCH="${{ github.ref_name }}"
          git fetch --unshallow origin "$BRANCH" 2>/dev/null || git fetch origin "$BRANCH"
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH"; then
              pushed=true
              break
            fi
            echo "push attempt $attempt failed; another job may have pushed first"
            sleep 5
          done
          if [ "$pushed" != true ]; then
            echo "::error::could not push generated artifacts after 3 attempts"
            exit 1
          fi
      - name: Enforce checks
        if: steps.fmt.outcome != 'success' || steps.clippy.outcome != 'success' || steps.test.outcome != 'success' || steps.goldens.outcome != 'success'
        run: exit 1

  artifacts-drift:
    name: Schema artifacts drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate schema + registry artifacts
        run: cargo run -p morphic-schema --bin export
      - name: Check drift
        run: git diff --exit-code -- schemas/
      - name: Post generated artifacts as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Generated schema artifacts"
            echo "### registry_v1.json"
            echo '```json'
            cat schemas/registry_v1.json
            echo '```'
            echo "### morphic_ui_schema_v1.json"
            echo '```json'
            cat schemas/morphic_ui_schema_v1.json
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json

  dart-quality:
    name: Dart (analyze · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/morphic_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Device-evidence gate tests
        working-directory: ${{ github.workspace }}
        run: python3 tools/test_check_device_evidence.py
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > /tmp/analyze.log 2>&1
      # Same bootstrap contract as the Rust `insta` snapshots: the first run generates the
      # images and the bot pushes them for review; every later run compares against what is
      # committed. This repo has no local Flutter, so a legitimate visual change cannot be
      # re-rendered on a laptop — `[regenerate-goldens]` in the commit message is the reviewable
      # escape hatch, and the bot's pushed PNG diff is the review artifact.
      - name: Golden image gate
        id: goldens
        continue-on-error: true
        run: |
          DIR=test/runtime/goldens
          if git log -1 --pretty=%B | grep -q '\[regenerate-goldens\]'; then
            echo "golden regeneration requested by the commit message"
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            flutter test --tags golden --update-goldens > /tmp/goldens.log 2>&1
            exit 0
          fi
          if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "goldens committed; image gate is LIVE"
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            flutter test --tags golden > /tmp/goldens.log 2>&1
            exit 0
          fi
          echo "goldens missing; generating once for first-commit bootstrap"
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          flutter test --tags golden --update-goldens > /tmp/goldens.log 2>&1
      - name: Test
        id: darttest
        continue-on-error: true
        # The image gate runs separately above; without the exclusion a missing golden would
        # fail the behavioural suite too and report the same problem twice.
        run: flutter test --exclude-tags golden > /tmp/darttest.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Dart CI — analyze: ${{ steps.analyze.outcome }} · test: ${{ steps.darttest.outcome }} · goldens: ${{ steps.goldens.outcome }}"
            echo '### analyze'
            echo '```'
            cat /tmp/analyze.log
            echo '```'
            echo '### versions'
            echo '```'
            flutter --version
            echo '```'
            echo '### head'
            echo '```'
            head -n 30 /tmp/darttest.log
            echo '```'
            echo '### failure details'
            echo '```'
            # Drop the passing lines and keep everything else verbatim. A pattern grep lost
            # the actual assertion text twice now: the banner matches, the message on the next
            # line does not, and the raw job log is not reachable from every environment.
            grep -vE "^✅|::group::✅|^::endgroup" /tmp/darttest.log | head -n 300
            echo '```'
            echo '### tail'
            echo '```'
            tail -n 30 /tmp/darttest.log
            echo '```'
            echo '### line-chart frame harness (host runner, not a phone)'
            echo '```'
            grep -E "MORPHIC_FRAME" /tmp/darttest.log | head -n 10 || echo "frame harness did not run"
            echo '```'
            echo "### golden images (gate: ${{ steps.goldens.outcome }}, bootstrapped: ${{ steps.goldens.outputs.bootstrapped }})"
            echo '```'
            grep -vE "^✅|::group::✅|^::endgroup" /tmp/goldens.log 2>/dev/null | head -n 120 || echo "golden step did not run"
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Commit bootstrapped golden images and push back
        id: goldpush
        if: steps.goldens.outputs.bootstrapped == 'true'
        continue-on-error: true
        # Repo root, like the Rust push-back. The first attempt ran in apps/morphic_flutter and
        # failed without saying why; a subshell captures the output so the report below can.
        working-directory: ${{ github.workspace }}
        run: |
          # GitHub runs this with -e; disable it so a failing subshell still reaches the cat.
          set +e
          (
            set -eo pipefail
            set -x
            DIR=apps/morphic_flutter/test/runtime/goldens
            if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
              echo "::error::golden run passed but wrote no images to $DIR"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git status --porcelain
            git diff --stat
            git add -A "$DIR"
            if git diff --cached --quiet; then
              echo "no golden changes to push"
              exit 0
            fi
            git commit -m "test: bootstrap bar-chart golden images [skip ci]"
            BRANCH="${{ github.ref_name }}"
            git fetch --unshallow origin "$BRANCH" || git fetch origin "$BRANCH" || true
            pushed=false
            for attempt in 1 2 3; do
              # Flutter's tooling dirties tracked files in this checkout (analysis_options.yaml
              # was modified on the first two runs), and a plain rebase refuses to run with a
              # dirty tree. Autostash sets that noise aside and restores it, without discarding
              # anything, so only the golden commit is ever rebased.
              if git -c rebase.autostash=true rebase FETCH_HEAD \
                && git push origin HEAD:"$BRANCH"; then
                pushed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              git fetch origin "$BRANCH" || true
              echo "push attempt $attempt failed; another job may have pushed first"
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push golden images after 3 attempts"
              exit 1
            fi
          ) > /tmp/goldpush.log 2>&1
          rc=$?
          set -e
          cat /tmp/goldpush.log
          exit $rc
      - name: Report golden bootstrap push
        if: always() && steps.goldens.outputs.bootstrapped == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Golden bootstrap push — ${{ steps.goldpush.outcome }}"
            echo '```'
            tail -n 80 /tmp/goldpush.log 2>/dev/null || echo "push step produced no log"
            echo '```'
          } > /tmp/pushreport.md
          jq -Rs '{body: .}' < /tmp/pushreport.md > /tmp/pushpayload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/pushpayload.json
      - name: Enforce checks
        if: steps.analyze.outcome != 'success' || steps.darttest.outcome != 'success' || steps.goldens.outcome != 'success' || (steps.goldens.outputs.bootstrapped == 'true' && steps.goldpush.outcome != 'success')
        run: exit 1

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [rust-quality, dart-quality]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate Flutter Android scaffolding
        run: |
          flutter create --platforms=android --org dev.morphic --project-name morphic_flutter /tmp/morphic_scaffold
          cp -rn /tmp/morphic_scaffold/android apps/morphic_flutter/
      - name: Pub get
        run: flutter pub get
        working-directory: apps/morphic_flutter
      - name: Build native libraries (3 ABIs)
        run: bash tools/build_android_native.sh
      # The Android scaffolding is regenerated every run, so without this the Gradle wrapper
      # re-downloads its ~200 MB distribution each time. A transient 504 from GitHub's release
      # CDN failed the whole job on 0b3993e for a docs-only commit.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('apps/morphic_flutter/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build debug APK
        id: apkbuild
        continue-on-error: true
        working-directory: apps/morphic_flutter
        run: |
          code=0
          for attempt in 1 2 3; do
            if flutter build apk --debug > /tmp/apk-build.log 2>&1; then
              code=0
              break
            else
              code=$?
            fi
            # Retry ONLY a distribution download failure. Retrying a compile error would burn
            # two minutes per attempt and still fail, and would blur a real defect into a flake.
            if grep -qE "HTTP response code: 5[0-9][0-9]|Could not (install|download) Gradle|gradle-distributions" /tmp/apk-build.log \
               && [ "$attempt" -lt 3 ]; then
              echo "Gradle distribution download failed (attempt $attempt of 3); retrying in 20s"
              sleep 20
              continue
            fi
            break
          done
          tail -n 40 /tmp/apk-build.log
          exit $code
      # Without this the Android job reports only an exit code, which is not diagnosable
      # from the API (runner log blobs are unreachable from the agent sandbox).
      - name: Report Android build output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Android build — ${{ steps.apkbuild.outcome }}"
            echo '```'
            tail -n 120 /tmp/apk-build.log 2>/dev/null || echo "(no build log)"
            echo '```'
          } > /tmp/apk-report.md
          jq -Rs '{body: .}' < /tmp/apk-report.md > /tmp/apk-payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/apk-payload.json
      - name: Enforce Android build
        if: steps.apkbuild.outcome != 'success'
        run: exit 1
      - name: Verify 16 KB alignment
        run: python3 tools/check_alignment.py apps/morphic_flutter/android/app/src/main/jniLibs
      # Task 1.1.7 adds the first Flutter plugin (file_picker), so the permission surface is
      # no longer an assumption. Report what the merged APK actually asks for and fail on
      # anything that contradicts the offline/private contract.
      - name: Audit APK permissions
        id: permissions
        continue-on-error: true
        run: |
          python3 tools/check_apk_permissions.py \
            apps/morphic_flutter/build/app/outputs/flutter-apk/app-debug.apk \
            --main-manifest apps/morphic_flutter/android/app/src/main/AndroidManifest.xml \
            > /tmp/permissions.log 2>&1
          cat /tmp/permissions.log
      - name: Report permissions as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## APK permissions — ${{ steps.permissions.outcome }}"
            echo '```'
            cat /tmp/permissions.log 2>/dev/null || echo "(audit did not run)"
            echo '```'
          } > /tmp/perm-report.md
          jq -Rs '{body: .}' < /tmp/perm-report.md > /tmp/perm-payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/perm-payload.json
      - name: Enforce permission audit
        if: steps.permissions.outcome != 'success'
        run: exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphic-debug-apk
          path: apps/morphic_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  android-runtime-smoke:
    name: Android runtime smoke (emulator)
    runs-on: ubuntu-22.04
    needs: [android-build]
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download debug APK (built by android-build)
        uses: actions/download-artifact@v4
        with:
          name: morphic-debug-apk
          path: /tmp/apk
      - name: Enable KVM (required for Android emulator on GitHub runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator + runtime smoke (manual, fully logged)
        id: emutest
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # GitHub's default shell is `bash -eo pipefail`; a transient `uiautomator dump`
          # failure (UI not idle while the engine spinner animates) would otherwise errexit
          # the whole script mid-loop. Correctness is enforced by the explicit exit-1 checks
          # below (booted / engine FFI / PoC), so disable errexit here.
          set +e
          set +o pipefail
          {
            echo "=== install system image (android-30 default x86_64) ==="
            echo y | sdkmanager "system-images;android-30;default;x86_64" 2>&1 | tail -5
            echo "=== create AVD ==="
            echo no | avdmanager create avd -n morphic_test -k "system-images;android-30;default;x86_64" --device "pixel_4" 2>&1 | tail -5
            echo "=== boot emulator (background) ==="
            nohup emulator -avd morphic_test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator_boot.log 2>&1 &
            echo "=== wait for device (up to 2 min) ==="
            timeout 120 adb wait-for-device || true
            echo "=== wait for boot complete (up to 5 min) ==="
            BOOTED=0
            for i in $(seq 1 60); do
              B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$B" = "1" ]; then BOOTED=1; break; fi
              sleep 5
            done
            echo "booted=$BOOTED"; adb devices
            if [ "$BOOTED" != "1" ]; then echo "EMULATOR_BOOT_FAILED"; tail -30 /tmp/emulator_boot.log; exit 1; fi
            echo "=== install APK ==="
            adb install -r /tmp/apk/app-debug.apk
            PKG=$(adb shell pm list packages | grep morphic | head -1 | sed 's/package://' | tr -d '\r')
            echo "package=$PKG"
            echo "=== launch ==="
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            echo "=== wait for engine FFI (UI text) ==="
            OK=0
            for i in $(seq 1 20); do
              sleep 3
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              if grep -q "Rust engine connected" /tmp/ui.xml; then OK=1; break; fi
            done
            echo "=== recent crashes (if any) ==="
            adb logcat -d -s AndroidRuntime:E | tail -20 || true
            if [ "$OK" != "1" ]; then
              echo "ENGINE_FFI_MISSING"; echo "--- UI dump ---"; head -c 2000 /tmp/ui.xml; exit 1
            fi
            echo "ENGINE_FFI_OK: Rust engine connected over FFI on the emulator"
            echo "=== run PoC: tap button, verify Rust CSV profile on-device ==="
            python3 tools/tap_poc.py
            POC=0
            for i in $(seq 1 15); do
              sleep 2
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              if grep -q "Detected schema" /tmp/ui.xml; then POC=1; break; fi
            done
            if [ "$POC" = "1" ]; then
              echo "POC_OK: CSV profiled by Rust and displayed on-device"
              grep -o '[0-9]* rows' /tmp/ui.xml | head -1 || true
            else
              echo "POC_MISSING"; echo "--- UI dump ---"; head -c 2000 /tmp/ui.xml; exit 1
            fi
            echo "=== generate workspace: real import must reach the live runtime ==="
            python3 tools/tap_poc.py "Generate workspace"
            GEN=0
            # The table sits below the metric cards and chart placeholders, and uiautomator
            # only dumps ON-SCREEN nodes — so scroll until the pager footer is visible.
            for i in $(seq 1 14); do
              sleep 2
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              # Require the RANGE, not just a data row. The range lives in the pager footer,
              # so seeing it proves the footer is on screen and the page has settled. Breaking
              # on the first data row let this stop with the footer below the fold, and the
              # "Next page" tap then hit nothing — a fold-dependent race, not an engine bug.
              if [ -n "$(python3 tools/read_row_range.py /tmp/ui.xml)" ]; then GEN=1; break; fi
              if [ $((i % 2)) = 0 ]; then
                adb shell input swipe 540 1600 540 500 300 >/dev/null 2>&1
              fi
            done
            if [ "$GEN" != "1" ]; then
              echo "RUNTIME_MISSING"; echo "--- visible nodes ---"
              python3 tools/ui_texts.py /tmp/ui.xml || head -c 2000 /tmp/ui.xml
              exit 1
            fi
            BEFORE="$(python3 tools/read_row_range.py /tmp/ui.xml --signature)"
            echo "RUNTIME_OK: live table rendered, range $(python3 tools/read_row_range.py /tmp/ui.xml)"
            echo "  first row: $BEFORE"
            echo "=== paging must be executed by Rust ==="
            # Belt and braces: confirm the control is really in the dump before tapping it.
            for i in $(seq 1 6); do
              if grep -q "Next page" /tmp/ui.xml; then break; fi
              adb shell input swipe 540 1600 540 700 300 >/dev/null 2>&1
              sleep 2
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
            done
            BEFORE="$(python3 tools/read_row_range.py /tmp/ui.xml --signature)"
            python3 tools/tap_poc.py "Next page"
            PAGE=0
            for i in $(seq 1 12); do
              sleep 3
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              AFTER="$(python3 tools/read_row_range.py /tmp/ui.xml --signature)"
              if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then PAGE=1; break; fi
            done
            if [ "$PAGE" = "1" ]; then
              echo "PAGING_OK: first row changed"
              echo "  before: $BEFORE"
              echo "  after:  $AFTER"
              echo "  range:  $(python3 tools/read_row_range.py /tmp/ui.xml)"
            else
              echo "PAGING_MISSING"; echo "--- visible nodes ---"
              python3 tools/ui_texts.py /tmp/ui.xml || head -c 2000 /tmp/ui.xml
              exit 1
            fi
            # Prove the AT-07 probe plumbing works end to end: navigate to it, run it, and
            # confirm the engine's timings reach logcat in the shape device_perf.sh parses.
            # The dataset here is 600 rows, so the probe MUST report "not AT-07 evidence" —
            # that refusal is the thing being tested. A pass on this sample would be a bug.
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
            if python3 tools/tap_poc.py "Performance probe"; then
              adb logcat -c >/dev/null 2>&1 || true
              sleep 2
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              python3 tools/tap_poc.py "Run probe"
              PROBE=0
              for i in $(seq 1 30); do
                sleep 2
                if adb logcat -d 2>/dev/null | grep -q "MORPHIC_PERF_JSON"; then PROBE=1; break; fi
              done
              if [ "$PROBE" = "1" ]; then
                LINE="$(adb logcat -d 2>/dev/null | grep -o 'MORPHIC_PERF [A-Z].*' | tail -1)"
                echo "PROBE_OK: $LINE"
                # Either honest refusal is fine (too small, or it could not build distinct
                # selections). Claiming a verdict on 600 rows is the bug this guards against.
                case "$LINE" in
                  *"AT-07 PASS"*|*"AT-07 FAIL"*)
                    echo "PROBE_DISHONEST: a 600-row run must not claim an AT-07 verdict"; exit 1 ;;
                  *"NOT AT-07 EVIDENCE"*)
                    echo "PROBE_HONEST: the 600-row sample was correctly refused as AT-07 evidence" ;;
                  *"DID NOT RUN"*)
                    echo "PROBE_HONEST: declined rather than reporting a number it could not trust" ;;
                  *)
                    echo "PROBE_UNPARSEABLE: $LINE"; exit 1 ;;
                esac
              else
                echo "PROBE_MISSING: no MORPHIC_PERF_JSON in logcat"; exit 1
              fi
            else
              echo "PROBE_UNREACHABLE: no 'Performance probe' action in the workspace app bar"
              python3 tools/ui_texts.py /tmp/ui.xml || true
              exit 1
            fi
            echo "NOTE: emulator evidence only — does not satisfy the physical-device rule."
          } > /tmp/emu_test.log 2>&1
      - name: Report emulator smoke output
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Emulator smoke — ${{ steps.emutest.outcome }}"
            echo '```'
            if [ -f /tmp/emu_test.log ]; then
              tail -50 /tmp/emu_test.log | cut -c1-400
            else
              echo "(no log produced — emulator action failed before script)"
              echo "--- /dev/kvm ---"; ls -la /dev/kvm 2>&1
              echo "--- cpu virt flags ---"; egrep -c '(vmx|svm)' /proc/cpuinfo 2>&1
              echo "--- ANDROID_HOME ---"; echo "$ANDROID_HOME"; ls "$ANDROID_HOME/emulator/emulator" 2>&1
            fi
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce emulator smoke
        if: always() && steps.emutest.outcome != 'success'
        run: |
          echo "Emulator runtime smoke did not pass (outcome: ${{ steps.emutest.outcome }})."
          exit 1

  perf-baseline:
    name: Perf baseline (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run CSV parse bench
        run: cargo bench -p morphic-ingest
      - name: Collect criterion baseline JSON
        run: |
          mkdir -p perf-baseline
          find target/criterion -name estimates.json | while read -r f; do
            name=$(echo "$f" | sed 's|target/criterion/||; s|/|_|g')
            cp "$f" "perf-baseline/$name"
          done
          ls -la perf-baseline/
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: perf-baseline/
          retention-days: 90
