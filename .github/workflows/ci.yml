name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets > /tmp/clippy.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        run: cargo test --workspace > /tmp/test.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Rust CI — clippy: ${{ steps.clippy.outcome }} · test: ${{ steps.test.outcome }}"
            echo "### clippy (tail)"
            echo '```'
            tail -n 80 /tmp/clippy.log
            echo '```'
            echo "### test (tail)"
            echo '```'
            tail -n 80 /tmp/test.log
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce checks
        if: steps.clippy.outcome != 'success' || steps.test.outcome != 'success'
        run: exit 1

  artifacts-drift:
    name: Schema artifacts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate schema + registry artifacts
        run: cargo run -p morphic-schema --bin export
      - name: Check drift
        run: git diff --exit-code -- schemas/

  dart-quality:
    name: Dart (analyze · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/morphic_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        id: darttest
        continue-on-error: true
        run: flutter test > /tmp/darttest.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Dart CI — test: ${{ steps.darttest.outcome }}"
            echo '```'
            tail -n 100 /tmp/darttest.log
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce checks
        if: steps.darttest.outcome != 'success'
        run: exit 1

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [rust-quality, dart-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate Flutter Android scaffolding
        run: |
          flutter create --platforms=android --org dev.morphic --project-name morphic_flutter /tmp/morphic_scaffold
          cp -rn /tmp/morphic_scaffold/android apps/morphic_flutter/
      - name: Pub get
        run: flutter pub get
        working-directory: apps/morphic_flutter
      - name: Build native libraries (3 ABIs)
        run: bash tools/build_android_native.sh
      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: apps/morphic_flutter
      - name: Verify 16 KB alignment
        run: python3 tools/check_alignment.py apps/morphic_flutter/android/app/src/main/jniLibs
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphic-debug-apk
          path: apps/morphic_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
