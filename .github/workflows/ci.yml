name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Phase 0 applies formatting in-runner; the `--check` gate is enabled once the
      # formatted tree is committed (see docs/engineering/ci-cd.md).
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-rust
          path: |
            engine/crates/**/*.rs
            apps/morphic_flutter/rust/src/**/*.rs
          retention-days: 7

  artifacts-drift:
    name: Schema artifacts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate schema + registry artifacts
        run: cargo run -p morphic-schema --bin export
      - name: Check drift
        run: git diff --exit-code -- schemas/
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schema-artifacts
          path: schemas/
          retention-days: 7

  dart-quality:
    name: Dart (analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/morphic_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [rust-quality, dart-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate Flutter Android scaffolding
        run: |
          flutter create --platforms=android --org dev.morphic --project-name morphic_flutter /tmp/morphic_scaffold
          cp -rn /tmp/morphic_scaffold/android apps/morphic_flutter/
      - name: Pub get
        run: flutter pub get
        working-directory: apps/morphic_flutter
      - name: Build native libraries (3 ABIs)
        run: bash tools/build_android_native.sh
      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: apps/morphic_flutter
      - name: Verify 16 KB alignment
        run: python3 tools/check_alignment.py apps/morphic_flutter/android/app/src/main/jniLibs
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphic-debug-apk
          path: apps/morphic_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
