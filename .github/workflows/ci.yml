name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (check)
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check > /tmp/fmt.log 2>&1
      - name: Clippy (deny warnings)
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
      # Golden snapshots must be committed to be a real gate. On the very first run after
      # goldens are introduced they do not exist yet, so generate them once and let the
      # auto-commit step below push them for review. Every later run takes the `exit 0`
      # branch and the committed snapshots gate normally (INSTA_UPDATE is never set).
      - name: Golden snapshots present?
        id: goldens
        continue-on-error: true
        run: |
          DIR=engine/crates/morphic-compiler/tests/snapshots
          # An explicit, reviewable regeneration. This repo has no local Rust toolchain, so a
          # legitimate behaviour change cannot be re-snapshotted on a laptop; without this the
          # only options are hand-editing snapshots or weakening the gate. The commit message
          # must ask for it, and the bot's pushed diff is the review artifact.
          if git log -1 --pretty=%B | grep -q '\[regenerate-goldens\]'; then
            echo "golden regeneration requested by the commit message"
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            INSTA_UPDATE=always cargo test -p morphic-compiler --test goldens > /tmp/goldens.log 2>&1
            exit 0
          fi
          if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "goldens committed; snapshot gate is LIVE"
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "goldens missing; generating once for first-commit bootstrap"
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          INSTA_UPDATE=always cargo test -p morphic-compiler --test goldens > /tmp/goldens.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        # --no-fail-fast: one failing target must not hide the others. Without it a golden
        # failure stopped the run before morphic-core's AT-02 scorer could write its scorecard.
        run: cargo test --workspace --no-fail-fast > /tmp/test.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Rust CI — fmt: ${{ steps.fmt.outcome }} · clippy: ${{ steps.clippy.outcome }} · test: ${{ steps.test.outcome }}"
            echo "### versions"
            echo '```'
            rustc --version; cargo --version
            echo '```'
            echo "### fmt (check)"
            echo '```'
            head -n 60 /tmp/fmt.log
            echo '```'
            echo "### clippy (tail)"
            echo '```'
            tail -n 80 /tmp/clippy.log
            echo '```'
            echo "### test (tail)"
            echo '```'
            tail -n 80 /tmp/test.log
            echo '```'
            echo "### test failures (extracted)"
            echo '```'
            grep -E "^test .* FAILED" /tmp/test.log | head -n 40 || true
            grep -A 6 "panicked at" /tmp/test.log | head -n 120 || true
            echo '```'
            echo "### Parser fuzz smoke"
            echo '```'
            cat target/fuzz-smoke.md 2>/dev/null || echo "fuzz report not produced"
            echo '```'
            echo "### AT-02 schema accuracy"
            echo '```'
            cat target/schema-accuracy.md 2>/dev/null || echo "scorecard not produced"
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Auto-format / commit bootstrapped goldens and push back
        if: steps.fmt.outcome != 'success' || steps.goldens.outputs.bootstrapped == 'true'
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: rustfmt + bootstrap compiler goldens [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Enforce checks
        if: steps.fmt.outcome != 'success' || steps.clippy.outcome != 'success' || steps.test.outcome != 'success' || steps.goldens.outcome != 'success'
        run: exit 1

  artifacts-drift:
    name: Schema artifacts drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate schema + registry artifacts
        run: cargo run -p morphic-schema --bin export
      - name: Check drift
        run: git diff --exit-code -- schemas/
      - name: Post generated artifacts as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Generated schema artifacts"
            echo "### registry_v1.json"
            echo '```json'
            cat schemas/registry_v1.json
            echo '```'
            echo "### morphic_ui_schema_v1.json"
            echo '```json'
            cat schemas/morphic_ui_schema_v1.json
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json

  dart-quality:
    name: Dart (analyze · test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/morphic_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > /tmp/analyze.log 2>&1
      - name: Test
        id: darttest
        continue-on-error: true
        run: flutter test > /tmp/darttest.log 2>&1
      - name: Report output as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Dart CI — analyze: ${{ steps.analyze.outcome }} · test: ${{ steps.darttest.outcome }}"
            echo '### analyze'
            echo '```'
            cat /tmp/analyze.log
            echo '```'
            echo '### versions'
            echo '```'
            flutter --version
            echo '```'
            echo '### head'
            echo '```'
            head -n 30 /tmp/darttest.log
            echo '```'
            echo '### failure details'
            echo '```'
            grep -nE "Expected|Actual|Which|EXCEPTION|was thrown|consider|failed|passed|loading|settled|pump" /tmp/darttest.log | head -n 40
            echo '```'
            echo '### tail'
            echo '```'
            tail -n 30 /tmp/darttest.log
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce checks
        if: steps.analyze.outcome != 'success' || steps.darttest.outcome != 'success'
        run: exit 1

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [rust-quality, dart-quality]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate Flutter Android scaffolding
        run: |
          flutter create --platforms=android --org dev.morphic --project-name morphic_flutter /tmp/morphic_scaffold
          cp -rn /tmp/morphic_scaffold/android apps/morphic_flutter/
      - name: Pub get
        run: flutter pub get
        working-directory: apps/morphic_flutter
      - name: Build native libraries (3 ABIs)
        run: bash tools/build_android_native.sh
      - name: Build debug APK
        id: apkbuild
        continue-on-error: true
        working-directory: apps/morphic_flutter
        run: |
          flutter build apk --debug > /tmp/apk-build.log 2>&1
          code=$?
          tail -n 40 /tmp/apk-build.log
          exit $code
      # Without this the Android job reports only an exit code, which is not diagnosable
      # from the API (runner log blobs are unreachable from the agent sandbox).
      - name: Report Android build output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Android build — ${{ steps.apkbuild.outcome }}"
            echo '```'
            tail -n 120 /tmp/apk-build.log 2>/dev/null || echo "(no build log)"
            echo '```'
          } > /tmp/apk-report.md
          jq -Rs '{body: .}' < /tmp/apk-report.md > /tmp/apk-payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/apk-payload.json
      - name: Enforce Android build
        if: steps.apkbuild.outcome != 'success'
        run: exit 1
      - name: Verify 16 KB alignment
        run: python3 tools/check_alignment.py apps/morphic_flutter/android/app/src/main/jniLibs
      # Task 1.1.7 adds the first Flutter plugin (file_picker), so the permission surface is
      # no longer an assumption. Report what the merged APK actually asks for and fail on
      # anything that contradicts the offline/private contract.
      - name: Audit APK permissions
        id: permissions
        continue-on-error: true
        run: |
          python3 tools/check_apk_permissions.py \
            apps/morphic_flutter/build/app/outputs/flutter-apk/app-debug.apk \
            --main-manifest apps/morphic_flutter/android/app/src/main/AndroidManifest.xml \
            > /tmp/permissions.log 2>&1
          cat /tmp/permissions.log
      - name: Report permissions as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## APK permissions — ${{ steps.permissions.outcome }}"
            echo '```'
            cat /tmp/permissions.log 2>/dev/null || echo "(audit did not run)"
            echo '```'
          } > /tmp/perm-report.md
          jq -Rs '{body: .}' < /tmp/perm-report.md > /tmp/perm-payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/perm-payload.json
      - name: Enforce permission audit
        if: steps.permissions.outcome != 'success'
        run: exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphic-debug-apk
          path: apps/morphic_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  android-runtime-smoke:
    name: Android runtime smoke (emulator)
    runs-on: ubuntu-22.04
    needs: [android-build]
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download debug APK (built by android-build)
        uses: actions/download-artifact@v4
        with:
          name: morphic-debug-apk
          path: /tmp/apk
      - name: Enable KVM (required for Android emulator on GitHub runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator + runtime smoke (manual, fully logged)
        id: emutest
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # GitHub's default shell is `bash -eo pipefail`; a transient `uiautomator dump`
          # failure (UI not idle while the engine spinner animates) would otherwise errexit
          # the whole script mid-loop. Correctness is enforced by the explicit exit-1 checks
          # below (booted / engine FFI / PoC), so disable errexit here.
          set +e
          set +o pipefail
          {
            echo "=== install system image (android-30 default x86_64) ==="
            echo y | sdkmanager "system-images;android-30;default;x86_64" 2>&1 | tail -5
            echo "=== create AVD ==="
            echo no | avdmanager create avd -n morphic_test -k "system-images;android-30;default;x86_64" --device "pixel_4" 2>&1 | tail -5
            echo "=== boot emulator (background) ==="
            nohup emulator -avd morphic_test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator_boot.log 2>&1 &
            echo "=== wait for device (up to 2 min) ==="
            timeout 120 adb wait-for-device || true
            echo "=== wait for boot complete (up to 5 min) ==="
            BOOTED=0
            for i in $(seq 1 60); do
              B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$B" = "1" ]; then BOOTED=1; break; fi
              sleep 5
            done
            echo "booted=$BOOTED"; adb devices
            if [ "$BOOTED" != "1" ]; then echo "EMULATOR_BOOT_FAILED"; tail -30 /tmp/emulator_boot.log; exit 1; fi
            echo "=== install APK ==="
            adb install -r /tmp/apk/app-debug.apk
            PKG=$(adb shell pm list packages | grep morphic | head -1 | sed 's/package://' | tr -d '\r')
            echo "package=$PKG"
            echo "=== launch ==="
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            echo "=== wait for engine FFI (UI text) ==="
            OK=0
            for i in $(seq 1 20); do
              sleep 3
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              if grep -q "Rust engine connected" /tmp/ui.xml; then OK=1; break; fi
            done
            echo "=== recent crashes (if any) ==="
            adb logcat -d -s AndroidRuntime:E | tail -20 || true
            if [ "$OK" != "1" ]; then
              echo "ENGINE_FFI_MISSING"; echo "--- UI dump ---"; head -c 2000 /tmp/ui.xml; exit 1
            fi
            echo "ENGINE_FFI_OK: Rust engine connected over FFI on the emulator"
            echo "=== run PoC: tap button, verify Rust CSV profile on-device ==="
            python3 tools/tap_poc.py
            POC=0
            for i in $(seq 1 15); do
              sleep 2
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              if grep -q "Detected schema" /tmp/ui.xml; then POC=1; break; fi
            done
            if [ "$POC" = "1" ]; then
              echo "POC_OK: CSV profiled by Rust and displayed on-device"
              grep -o '[0-9]* rows' /tmp/ui.xml | head -1 || true
            else
              echo "POC_MISSING"; echo "--- UI dump ---"; head -c 2000 /tmp/ui.xml; exit 1
            fi
            echo "=== generate workspace: real import must reach the live runtime ==="
            python3 tools/tap_poc.py "Generate workspace"
            GEN=0
            # The table sits below the metric cards and chart placeholders, and uiautomator
            # only dumps ON-SCREEN nodes — so scroll until the pager footer is visible.
            for i in $(seq 1 14); do
              sleep 2
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              if [ -n "$(python3 tools/read_row_range.py /tmp/ui.xml --signature)" ]; then GEN=1; break; fi
              if [ $((i % 2)) = 0 ]; then
                adb shell input swipe 540 1600 540 500 300 >/dev/null 2>&1
              fi
            done
            if [ "$GEN" != "1" ]; then
              echo "RUNTIME_MISSING"; echo "--- visible nodes ---"
              python3 tools/ui_texts.py /tmp/ui.xml || head -c 2000 /tmp/ui.xml
              exit 1
            fi
            BEFORE="$(python3 tools/read_row_range.py /tmp/ui.xml --signature)"
            echo "RUNTIME_OK: live table rendered, range $(python3 tools/read_row_range.py /tmp/ui.xml)"
            echo "  first row: $BEFORE"
            echo "=== paging must be executed by Rust ==="
            python3 tools/tap_poc.py "Next page"
            PAGE=0
            for i in $(seq 1 12); do
              sleep 3
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1
              AFTER="$(python3 tools/read_row_range.py /tmp/ui.xml --signature)"
              if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then PAGE=1; break; fi
            done
            if [ "$PAGE" = "1" ]; then
              echo "PAGING_OK: first row changed"
              echo "  before: $BEFORE"
              echo "  after:  $AFTER"
              echo "  range:  $(python3 tools/read_row_range.py /tmp/ui.xml)"
            else
              echo "PAGING_MISSING"; echo "--- visible nodes ---"
              python3 tools/ui_texts.py /tmp/ui.xml || head -c 2000 /tmp/ui.xml
              exit 1
            fi
            echo "NOTE: emulator evidence only — does not satisfy the physical-device rule."
          } > /tmp/emu_test.log 2>&1
      - name: Report emulator smoke output
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Emulator smoke — ${{ steps.emutest.outcome }}"
            echo '```'
            if [ -f /tmp/emu_test.log ]; then
              tail -50 /tmp/emu_test.log | cut -c1-400
            else
              echo "(no log produced — emulator action failed before script)"
              echo "--- /dev/kvm ---"; ls -la /dev/kvm 2>&1
              echo "--- cpu virt flags ---"; egrep -c '(vmx|svm)' /proc/cpuinfo 2>&1
              echo "--- ANDROID_HOME ---"; echo "$ANDROID_HOME"; ls "$ANDROID_HOME/emulator/emulator" 2>&1
            fi
            echo '```'
          } > /tmp/report.md
          jq -Rs '{body: .}' < /tmp/report.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/payload.json
      - name: Enforce emulator smoke
        if: always() && steps.emutest.outcome != 'success'
        run: |
          echo "Emulator runtime smoke did not pass (outcome: ${{ steps.emutest.outcome }})."
          exit 1

  perf-baseline:
    name: Perf baseline (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run CSV parse bench
        run: cargo bench -p morphic-ingest
      - name: Collect criterion baseline JSON
        run: |
          mkdir -p perf-baseline
          find target/criterion -name estimates.json | while read -r f; do
            name=$(echo "$f" | sed 's|target/criterion/||; s|/|_|g')
            cp "$f" "perf-baseline/$name"
          done
          ls -la perf-baseline/
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: perf-baseline/
          retention-days: 90
