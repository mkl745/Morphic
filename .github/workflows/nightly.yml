name: Nightly quality

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny (licenses / bans / advisories / sources)
        run: cargo deny check
      - name: cargo-audit
        run: cargo audit

  rust-tests:
    name: Full Rust test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --no-fail-fast
      # M1.5 task 1.5.4: the named nightly chaos suite. The full release test above already
      # includes these cases; running them by name gives the nightly log a clear signal for
      # torn journals, interrupted writes, quarantine and crash-window replay.
      - name: Kill-mid-save chaos suite
        run: |
          set -e
          cargo test -p morphic-workspace --release --lib startup_recovery -- --nocapture
          cargo test -p morphic-workspace --release --lib an_explicit_checkpoint -- --nocapture
          cargo test -p morphic-core --release --lib a_kill_between -- --nocapture
      # The same seeded mutation harness CI runs on every push, with a much longer stream.
      # Coverage-guided fuzzing (cargo-fuzz) is still not adopted: it needs a nightly toolchain
      # and a corpus directory, and a fuzzer nobody runs is worth less than a smoke everybody
      # runs. This is the deep version of the smoke, not a replacement for one.
      - name: Deep parser fuzz smoke
        env:
          MORPHIC_FUZZ_CASES: "40000"
        run: |
          cargo test -p morphic-ingest --test fuzz_smoke --release
          cat target/fuzz-smoke.md

  perf-baseline:
    name: Perf baseline (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run CSV parse bench
        run: cargo bench -p morphic-ingest
      - name: Collect criterion baseline JSON
        run: |
          mkdir -p perf-baseline
          find target/criterion -name estimates.json | while read -r f; do
            name=$(echo "$f" | sed 's|target/criterion/||; s|/|_|g')
            cp "$f" "perf-baseline/$name"
          done
          ls -la perf-baseline/
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: perf-baseline/
          retention-days: 90

  # Emulator runtime smoke runs in ci.yml (manual boot). The parser fuzz smoke landed with
  # the M1.2 exit work and runs in both places; the Dart frame-timing collector is still owed.
  #
  # NOTE: this workflow is not registered with GitHub yet. GitHub only registers workflow
  # files that exist on the DEFAULT branch, and this one lives on a feature branch, so
  # `gh workflow run nightly.yml` returns 404 and the schedule has never fired. It will start
  # working when the branch merges to main. Until then CI is what actually runs, which is why
  # the fuzz smoke and the AT-02 scorer were both put there rather than only here.
