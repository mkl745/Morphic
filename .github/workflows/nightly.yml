name: Nightly quality

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny (licenses / bans / advisories / sources)
        run: cargo deny check
      - name: cargo-audit
        run: cargo audit

  rust-tests:
    name: Full Rust test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  # Emulator integration tests + perf harness + parser fuzz are added in M1.1
  # once integration_test and the perf collector exist (docs/engineering/ci-cd.md).
