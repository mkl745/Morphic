name: morphic_flutter
description: "MORPHIC — Your Data. Your Interface. A local-first adaptive workspace engine."
publish_to: "none"
# Bumped from 0.1.0+1: the versionCode had never changed, so Android could not tell one CI
# artifact from another and some installers treat an equal versionCode as "already installed".
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

# Dependencies are governed by docs/engineering/dependency-strategy.md §2.
# flutter_rust_bridge + cargokit are deferred to M1.7 (ADR-0014); go_router and Riverpod
# are not needed while navigation is four named routes and state is two controllers.
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.3
  # SAF import (task 1.1.7). Behind PlatformFileSource so it can be replaced or faked.
  # 12.x, not 11.x: v11 applies KGP and fails to build under Flutter 3.47 Built-in Kotlin.
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
