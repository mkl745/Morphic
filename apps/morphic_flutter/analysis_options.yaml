include: package:flutter_lints/flutter.yaml

# Phase 0 uses the standard flutter_lints set. Stricter analysis (strict-casts,
# strict-inference) and additional rules are tightened in M1.1 once the production
# state-management and bridge layers land.
#
# Flutter 3.50 stable marks `package:flutter/material.dart` deprecated in favour of
# `package:material_ui/material_ui.dart`. That package is not a dependency yet; adopting it
# mid-milestone would change every widget import for no user-visible gain. Suppress only the
# resulting info-level lint, keeping all other analyzer findings fatal.
analyzer:
  errors:
    deprecated_member_use: ignore
