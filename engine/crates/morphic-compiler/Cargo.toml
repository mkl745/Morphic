[package]
name = "morphic-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MORPHIC UI compiler: profile + intent -> validated workspace doc (Phase 0: minimal rules)."

[dependencies]
morphic-model.workspace = true
morphic-schema.workspace = true
morphic-semantic.workspace = true
serde.workspace = true
# The error metric's restriction is a FilterExpr, whose value is JSON. Building one is planner
# work, not test work, so this moved out of dev-dependencies in 1.4.5.
serde_json.workspace = true

[dev-dependencies]
morphic-ingest.workspace = true
insta = { version = "1", features = ["json"] }
