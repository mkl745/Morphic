[workspace]
resolver = "2"
members = [
    "engine/crates/morphic-model",
    "engine/crates/morphic-ingest",
    "engine/crates/morphic-semantic",
    "engine/crates/morphic-query",
    "engine/crates/morphic-schema",
    "engine/crates/morphic-compiler",
    "engine/crates/morphic-workspace",
    "engine/crates/morphic-core",
    "apps/morphic_flutter/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkl745/Morphic"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
schemars = "0.8"
thiserror = "1"
# Dataset content addressing (docs/engineering/dependency-strategy.md §3, RustCrypto).
sha2 = "0.10"

# Internal crates
morphic-model = { path = "engine/crates/morphic-model" }
morphic-ingest = { path = "engine/crates/morphic-ingest" }
morphic-semantic = { path = "engine/crates/morphic-semantic" }
morphic-query = { path = "engine/crates/morphic-query" }
morphic-schema = { path = "engine/crates/morphic-schema" }
morphic-compiler = { path = "engine/crates/morphic-compiler" }
morphic-workspace = { path = "engine/crates/morphic-workspace" }
morphic-core = { path = "engine/crates/morphic-core" }

# NOTE: panic = "abort" is intentionally NOT set. The bridge relies on
# catch_unwind as a panic firewall (docs/architecture/02), which requires unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
